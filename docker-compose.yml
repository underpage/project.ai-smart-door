version: '3.8'

services:

  server:
    build: ./server
    container_name: smartdoor-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - smartdoor-internal
      - my-net

  dashboard:
    build: ./dashboard
    container_name: smartdoor-dashboard
    ports:
      - "3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - smartdoor-internal

  redis:
    image: redis:7-alpine
    container_name: smartdoor-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - smartdoor-internal

volumes:
  redis-data:
    driver: local

networks:
  smartdoor-internal:
    driver: bridge

  my-net:
    external: true