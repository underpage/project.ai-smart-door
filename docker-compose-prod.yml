version: '3.8'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - server
      - dashboard
    restart: unless-stopped
    networks:
      - smartdoor-internal

  server:
    build: ./server
    container_name: smartdoor-server
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - smartdoor-internal
      - my-net

  dashboard:
    build: ./dashboard
    container_name: smartdoor-dashboard
    environment:
      - REACT_APP_API_URL=/api
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - smartdoor-internal

  redis:
    image: redis:7-alpine
    container_name: smartdoor-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - smartdoor-internal

volumes:
  redis-data:
    driver: local

networks:
  smartdoor-internal:
    driver: bridge

  my-net:
    external: true